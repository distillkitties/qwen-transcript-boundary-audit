name: Qwen Transcript Boundary Audit Fixed

on:
  workflow_dispatch:
    inputs:
      qwen_model:
        description: "MLX Qwen model repo"
        required: false
        default: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
      n_cases:
        description: "Number of finite audit cases"
        required: false
        default: "120"
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

env:
  DEFAULT_QWEN_MODEL: mlx-community/Qwen2.5-0.5B-Instruct-4bit
  DEFAULT_N_CASES: "120"
  PYTHONUNBUFFERED: "1"

jobs:
  qwen-transcript-boundary-audit:
    name: Lean proofs + real Qwen/MLX boundary audit
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select inputs
        run: |
          set -euxo pipefail

          MODEL_INPUT="${{ github.event.inputs.qwen_model || '' }}"
          CASE_INPUT="${{ github.event.inputs.n_cases || '' }}"

          if [ -z "$MODEL_INPUT" ]; then
            MODEL_INPUT="$DEFAULT_QWEN_MODEL"
          fi

          if [ -z "$CASE_INPUT" ]; then
            CASE_INPUT="$DEFAULT_N_CASES"
          fi

          echo "QWEN_MODEL=$MODEL_INPUT" >> "$GITHUB_ENV"
          echo "N_CASES=$CASE_INPUT" >> "$GITHUB_ENV"

          echo "Selected model: $MODEL_INPUT"
          echo "Selected case count: $CASE_INPUT"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MLX, mlx-lm, and report dependencies
        run: |
          set -euxo pipefail

          python3 -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip
          python -m pip install mlx mlx-lm numpy pandas matplotlib

          python - <<'PY'
          import platform
          import sys
          import mlx.core as mx

          x = mx.array([1.0, 2.0, 3.0])
          y = mx.sum(x)
          mx.eval(y)

          print("=" * 100)
          print("MLX smoke test")
          print("=" * 100)
          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("Machine:", platform.machine())
          print("MLX default device:", mx.default_device())
          print("MLX sum:", float(y))
          print("Verdict: PASS")
          print("=" * 100)
          PY

      - name: Generate Lean proof artifact
        run: |
          set -euxo pipefail

          rm -rf PACXAI scripts experiments results ci-results qwen-transcript-boundary-audit
          rm -f lean-toolchain lakefile.lean PACXAI.lean README.md REPRODUCE.md LIMITATIONS.md THREAT_MODEL.md ARTIFACT_EVALUATION_README.md MANIFEST.json *.zip

          mkdir -p PACXAI scripts experiments results

          cat > lean-toolchain <<'EOF'
          leanprover/lean4:v4.30.0-rc2
          EOF

          cat > lakefile.lean <<'EOF'
          import Lake
          open Lake DSL

          package «qwen_transcript_boundary_audit» where

          @[default_target]
          lean_lib PACXAI where
            roots := #[`PACXAI]
          EOF

          cat > PACXAI.lean <<'EOF'
          import PACXAI.Core
          import PACXAI.AuditBoundary

          namespace PACXAI

          theorem ci_smoke : True := by
            trivial

          end PACXAI
          EOF

          cat > PACXAI/Core.lean <<'EOF'
          namespace PACXAI

          abbrev Observation (Secret Output : Type) := Secret -> Output
          abbrev Criterion (Secret Guess : Type) := Secret -> Guess -> Bool
          abbrev Population (Secret : Type) := List Secret

          def countWhere {A : Type} (xs : List A) (p : A -> Bool) : Nat :=
            (xs.filter p).length

          def successCount {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (attack : Secret -> Guess) : Nat :=
            countWhere secrets (fun s => criterion s (attack s))

          structure EmpiricalRate where
            numerator : Nat
            denominator : Nat
            deriving Repr, BEq

          def successRate {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (attack : Secret -> Guess) : EmpiricalRate :=
            { numerator := successCount secrets criterion attack, denominator := secrets.length }

          def passesBudget {Secret Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (budget : Nat)
              (attack : Secret -> Guess) : Prop :=
            successCount secrets criterion attack <= budget

          def postprocess {Secret Raw Out : Type}
              (obs : Observation Secret Raw)
              (f : Raw -> Out) : Observation Secret Out :=
            fun s => f (obs s)

          def liftedAttack {Raw Out Guess : Type}
              (f : Raw -> Out)
              (attack : Out -> Guess) : Raw -> Guess :=
            fun r => attack (f r)

          theorem postprocess_successCount_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess) :
              successCount secrets criterion (fun s => attack ((postprocess obs f) s)) =
              successCount secrets criterion (fun s => (liftedAttack f attack) (obs s)) := by
            rfl

          theorem postprocess_successRate_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess) :
              successRate secrets criterion (fun s => attack ((postprocess obs f) s)) =
              successRate secrets criterion (fun s => (liftedAttack f attack) (obs s)) := by
            rfl

          theorem postprocess_budget_sound {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (budget : Nat)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : Out -> Guess)
              (h : passesBudget secrets criterion budget (fun s => (liftedAttack f attack) (obs s))) :
              passesBudget secrets criterion budget (fun s => attack ((postprocess obs f) s)) := by
            exact h

          end PACXAI
          EOF

          cat > PACXAI/AuditBoundary.lean <<'EOF'
          import PACXAI.Core

          namespace PACXAI

          structure DistillationCampaign (Secret Transcript Student Guess : Type) where
            population : Population Secret
            criterion : Criterion Secret Guess
            transcript : Observation Secret Transcript
            train : Transcript -> Student
            studentAttack : Student -> Guess

          def studentObservation {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) : Observation Secret Student :=
            postprocess c.transcript c.train

          def transcriptSimulator {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) : Transcript -> Guess :=
            liftedAttack c.train c.studentAttack

          theorem student_attack_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) :
              successCount c.population c.criterion (fun s => c.studentAttack ((studentObservation c) s)) =
              successCount c.population c.criterion (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          theorem student_rate_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess) :
              successRate c.population c.criterion (fun s => c.studentAttack ((studentObservation c) s)) =
              successRate c.population c.criterion (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          def conditionPopulation {Secret : Type}
              (secrets : Population Secret)
              (condition : Secret -> Bool) : Population Secret :=
            secrets.filter condition

          theorem conditional_student_attack_lifts_to_transcript {Secret Transcript Student Guess : Type}
              (c : DistillationCampaign Secret Transcript Student Guess)
              (condition : Secret -> Bool) :
              successCount (conditionPopulation c.population condition) c.criterion
                  (fun s => c.studentAttack ((studentObservation c) s)) =
              successCount (conditionPopulation c.population condition) c.criterion
                  (fun s => (transcriptSimulator c) (c.transcript s)) := by
            rfl

          abbrev CandidateAttack (Observation Guess : Type) := Observation -> Guess
          abbrev CandidateClass (Obs Guess : Type) := List (CandidateAttack Obs Guess)

          def observedSuccessCount {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (attack : CandidateAttack Obs Guess) : Nat :=
            successCount secrets criterion (fun s => attack (obs s))

          def candidateScores {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (candidates : CandidateClass Obs Guess) : List Nat :=
            candidates.map (fun attack => observedSuccessCount secrets criterion obs attack)

          def bestNat : List Nat -> Nat
            | [] => 0
            | x :: xs => Nat.max x (bestNat xs)

          def candidateBestSuccess {Secret Obs Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (candidates : CandidateClass Obs Guess) : Nat :=
            bestNat (candidateScores secrets criterion obs candidates)

          def liftCandidateClass {Raw Out Guess : Type}
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) : CandidateClass Raw Guess :=
            candidates.map (liftedAttack f)

          theorem candidateScores_postprocess_eq {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) :
              candidateScores secrets criterion (postprocess obs f) candidates =
              candidateScores secrets criterion obs (liftCandidateClass f candidates) := by
            induction candidates with
            | nil => rfl
            | cons a rest ih =>
                simp [candidateScores, liftCandidateClass, observedSuccessCount, postprocess, liftedAttack,
                  successCount, countWhere]

          theorem candidateBest_postprocess_eq_lifted {Secret Raw Out Guess : Type}
              (secrets : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Raw)
              (f : Raw -> Out)
              (candidates : CandidateClass Out Guess) :
              candidateBestSuccess secrets criterion (postprocess obs f) candidates =
              candidateBestSuccess secrets criterion obs (liftCandidateClass f candidates) := by
            simp [candidateBestSuccess, candidateScores_postprocess_eq]

          abbrev Code (A : Type) := A -> Nat

          def observedCodeCost {Secret Obs : Type}
              (secrets : Population Secret)
              (obs : Observation Secret Obs)
              (code : Code Obs) : Nat :=
            (secrets.map (fun s => code (obs s))).foldl (fun acc n => acc + n) 0

          def pullCode {A B : Type} (f : A -> B) (code : Code B) : Code A :=
            fun a => code (f a)

          theorem deterministic_code_cost_exact {Secret Raw Out : Type}
              (secrets : Population Secret)
              (raw : Observation Secret Raw)
              (f : Raw -> Out)
              (outCode : Code Out) :
              observedCodeCost secrets (postprocess raw f) outCode =
              observedCodeCost secrets raw (pullCode f outCode) := by
            rfl

          structure MonteCarloCertificate where
            samples : Nat
            successes : Nat
            allowedSuccesses : Nat
            deriving Repr, BEq

          def MonteCarloCertificate.Passes (c : MonteCarloCertificate) : Prop :=
            c.successes <= c.allowedSuccesses

          def monteCarloFromAttack {Secret Obs Guess : Type}
              (samples : Population Secret)
              (criterion : Criterion Secret Guess)
              (obs : Observation Secret Obs)
              (attack : CandidateAttack Obs Guess)
              (allowedSuccesses : Nat) : MonteCarloCertificate :=
            { samples := samples.length,
              successes := observedSuccessCount samples criterion obs attack,
              allowedSuccesses := allowedSuccesses }

          theorem monteCarlo_transcript_pass_implies_student_pass {Secret Raw Out Guess : Type}
              (samples : Population Secret)
              (criterion : Criterion Secret Guess)
              (raw : Observation Secret Raw)
              (f : Raw -> Out)
              (attack : CandidateAttack Out Guess)
              (allowedSuccesses : Nat)
              (h : (monteCarloFromAttack samples criterion raw (liftedAttack f attack) allowedSuccesses).Passes) :
              (monteCarloFromAttack samples criterion (postprocess raw f) attack allowedSuccesses).Passes := by
            exact h

          end PACXAI
          EOF

          cat > scripts/audit.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "[audit] forbidden token scan"
          if grep -RIn --include='*.lean' \
            -e '\bsorry\b' -e '\badmit\b' -e '\baxiom\b' -e '\bconstant\b' \
            -e '\bunsafe\b' -e '\bopaque\b' -e 'TODO' -e 'FIXME' \
            PACXAI PACXAI.lean lakefile.lean; then
            echo "Forbidden token found" >&2
            exit 1
          else
            echo "No forbidden tokens found"
          fi

          echo "[audit] theorem check"
          cat > /tmp/PACXAIPrint.lean <<'LEAN'
          import PACXAI
          #print axioms PACXAI.postprocess_successCount_eq
          #print axioms PACXAI.postprocess_successRate_eq
          #print axioms PACXAI.postprocess_budget_sound
          #print axioms PACXAI.student_attack_lifts_to_transcript
          #print axioms PACXAI.student_rate_lifts_to_transcript
          #print axioms PACXAI.conditional_student_attack_lifts_to_transcript
          #print axioms PACXAI.candidateBest_postprocess_eq_lifted
          #print axioms PACXAI.deterministic_code_cost_exact
          #print axioms PACXAI.monteCarlo_transcript_pass_implies_student_pass
          LEAN
          lake env lean /tmp/PACXAIPrint.lean
          EOF
          chmod +x scripts/audit.sh

          cat > README.md <<'EOF'
          # Qwen Transcript Boundary Audit

          This artifact combines Lean proofs with real Qwen inference through MLX.

          Lean proves the valid audit boundary:

          ```text
          train : Transcript -> Student
          ```

          Qwen demonstrates the failure mode:

          ```text
          train : Transcript -> RouteMetadata -> Student
          ```

          If route metadata is omitted from the audited transcript, a transcript-only audit can falsely pass.
          EOF

          cat > THREAT_MODEL.md <<'EOF'
          # Threat Model

          Protected secret: a hidden capability/route class.

          Audited transcript: the text/log boundary claimed by the auditor.

          Omitted metadata: route_id values such as code_route, safety_route, expert_route.

          Claim: post-processing soundness only applies when every training/inference input used by the artifact is inside the audited transcript boundary.
          EOF

          cat > LIMITATIONS.md <<'EOF'
          # Limitations

          This artifact is a finite transcript-boundary audit.

          It does not claim:
          - full Shannon entropy formalization;
          - Gaussian rate-distortion formalization;
          - large-scale Qwen fine-tuning;
          - production model extraction;
          - that every metadata field leaks in every deployment.

          It does claim:
          - Lean-checked finite post-processing accounting;
          - real Qwen inference via MLX;
          - a concrete omitted-route-metadata false-pass experiment;
          - reproducible raw prompts and raw model outputs.
          EOF

          cat > REPRODUCE.md <<'EOF'
          # Reproduce

          ```bash
          lake build
          bash scripts/audit.sh
          source .venv/bin/activate
          python experiments/qwen_boundary_audit.py --model mlx-community/Qwen2.5-0.5B-Instruct-4bit --n-cases 120
          python experiments/make_report.py
          ```

          Expected headline result:
          - Lean build succeeds.
          - Lean audit has no forbidden proof tokens.
          - At least one metadata condition improves recovery over transcript-only.
          - HTML report appears at `results/publishable_artifacts/index.html`.
          EOF

          cat > ARTIFACT_EVALUATION_README.md <<'EOF'
          # Artifact Evaluation README

          Open the reviewer packet and start with:

          ```text
          OPEN_ME_FIRST.md
          results/publishable_artifacts/index.html
          results/qwen_boundary_audit/summary.json
          logs/lean-audit.log
          logs/qwen-boundary-audit.log
          MANIFEST.json
          ```
          EOF

      - name: Write Qwen audit and reporting scripts
        run: |
          set -euxo pipefail

          cat > experiments/qwen_boundary_audit.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import csv
          import hashlib
          import json
          import math
          import random
          import re
          import statistics
          import time
          from pathlib import Path
          from typing import Dict, List

          from mlx_lm import generate, load

          LABELS = ["reasoning", "coding", "tool_use", "computer_use", "policy_edge", "domain_expert"]

          ROUTES = {
              "reasoning_route": "reasoning",
              "code_route": "coding",
              "tool_route": "tool_use",
              "computer_route": "computer_use",
              "safety_route": "policy_edge",
              "expert_route": "domain_expert",
          }

          TRANSCRIPT_TEMPLATES = {
              "reasoning": [
                  "The response compares alternatives, weighs evidence, and reaches a compact judgment.",
                  "The response uses stepwise logic to evaluate a puzzle-like request.",
                  "The response gives a multi-step conclusion without code or tool execution.",
              ],
              "coding": [
                  "The response discusses implementation details, failing runs, syntax, and a concrete fix.",
                  "The response involves files, code paths, and a patch-like technical solution.",
                  "The response diagnoses a build or script issue and proposes exact code changes.",
              ],
              "tool_use": [
                  "The response coordinates external actions, checks outputs, and updates a result.",
                  "The response describes sequencing available tools and validating their results.",
                  "The response plans a workflow using search, retrieval, or artifact operations.",
              ],
              "computer_use": [
                  "The response discusses screen state, clicking, app navigation, and operating a graphical interface.",
                  "The response involves using a browser or computer UI to complete a task.",
                  "The response references interface actions, visual checks, and system interaction.",
              ],
              "policy_edge": [
                  "The response handles a borderline request with careful constraints and safety boundaries.",
                  "The response contains a sensitive request and a narrowed, policy-aware answer.",
                  "The response refuses or redirects part of the request while preserving safe help.",
              ],
              "domain_expert": [
                  "The response gives a specialist technical review with scope, novelty, limitations, and evidence.",
                  "The response uses domain-specific judgment and compares subtle expert alternatives.",
                  "The response reads like a publication-style technical evaluation.",
              ],
          }

          QUERY_FAMILIES = [
              "classification",
              "artifact review",
              "workflow debugging",
              "safety transformation",
              "technical comparison",
              "interface operation",
              "publication evaluation",
              "implementation repair",
          ]

          def build_cases(n: int) -> List[Dict[str, str]]:
              route_items = list(ROUTES.items())
              cases = []
              for i in range(n):
                  route_id, label = route_items[i % len(route_items)]
                  template = TRANSCRIPT_TEMPLATES[label][(i // len(route_items)) % len(TRANSCRIPT_TEMPLATES[label])]
                  query_family = QUERY_FAMILIES[(i * 7 + len(label)) % len(QUERY_FAMILIES)]
                  cases.append({
                      "id": f"case_{i+1:04d}",
                      "label": label,
                      "route_id": route_id,
                      "query_family": query_family,
                      "transcript": template,
                  })
              return cases

          def prompt_for(case: Dict[str, str], condition: str) -> str:
              labels = ", ".join(LABELS)

              if condition == "transcript_only":
                  return f"""You are auditing an assistant transcript.

          Infer the hidden capability label.

          Valid labels: {labels}

          Audited transcript:
          {case['transcript']}

          Query family:
          {case['query_family']}

          Return exactly one valid label and no other text.
          """

              if condition == "route_id_only":
                  return f"""You are auditing an assistant transcript.

          Infer the hidden capability label.

          Valid labels: {labels}

          Audited transcript:
          {case['transcript']}

          Metadata outside audited transcript:
          route_id = {case['route_id']}

          Return exactly one valid label and no other text.
          """

              if condition == "natural_metadata":
                  natural = {
                      "reasoning_route": "planner=deliberative; queue=analysis_general; rubric=multi_step_reasoning",
                      "code_route": "planner=compiler_assisted; queue=software_build; rubric=implementation_repair",
                      "tool_route": "planner=tool_orchestrator; queue=tool_workflow; rubric=external_action_sequence",
                      "computer_route": "planner=desktop_operator; queue=computer_control; rubric=ui_state",
                      "safety_route": "planner=policy_reviewer; queue=safety_edge; rubric=boundary_sensitive",
                      "expert_route": "planner=domain_panel; queue=expert_eval; rubric=specialist_review",
                  }[case["route_id"]]
                  return f"""You are auditing an assistant transcript.

          Infer the hidden capability label.

          Valid labels: {labels}

          Audited transcript:
          {case['transcript']}

          Metadata outside audited transcript:
          route_id = {case['route_id']}
          {natural}

          Return exactly one valid label and no other text.
          """

              if condition == "forced_route_metadata":
                  return f"""You are given deployment metadata that was not included in the audited transcript.

          Valid labels: {labels}

          The metadata route_id is:
          {case['route_id']}

          Use this route dictionary:
          reasoning_route means reasoning.
          code_route means coding.
          tool_route means tool_use.
          computer_route means computer_use.
          safety_route means policy_edge.
          expert_route means domain_expert.

          What valid label does the route_id mean?

          Return exactly one valid label and no other text.
          """

              raise ValueError(condition)

          def parse_label(text: str) -> str:
              t = text.strip().lower()
              t = re.sub(r"[^a-z_ ]", " ", t)
              t = re.sub(r"\s+", " ", t)

              route_aliases = {
                  "reasoning_route": "reasoning",
                  "code_route": "coding",
                  "tool_route": "tool_use",
                  "computer_route": "computer_use",
                  "safety_route": "policy_edge",
                  "expert_route": "domain_expert",
              }

              for route, label in route_aliases.items():
                  if route in t:
                      return label

              for label in LABELS:
                  if re.search(rf"\b{re.escape(label)}\b", t):
                      return label

              aliases = {
                  "reasoning": ["reason", "logic", "analysis"],
                  "coding": ["code", "programming", "software", "compiler", "implementation"],
                  "tool_use": ["tool", "tools", "orchestrator", "workflow"],
                  "computer_use": ["computer", "browser", "gui", "desktop", "screen", "ui"],
                  "policy_edge": ["safety", "policy", "boundary", "sensitive"],
                  "domain_expert": ["expert", "specialist", "domain", "publication", "review"],
              }

              for label, words in aliases.items():
                  for word in words:
                      if re.search(rf"\b{re.escape(word)}\b", t):
                          return label

              return "invalid"

          def qwen_generate(model, tokenizer, prompt: str, max_tokens: int) -> str:
              try:
                  return generate(model, tokenizer, prompt=prompt, max_tokens=max_tokens, temp=0.0, top_p=1.0, verbose=False)
              except TypeError:
                  try:
                      return generate(model, tokenizer, prompt=prompt, max_tokens=max_tokens, temperature=0.0, top_p=1.0, verbose=False)
                  except TypeError:
                      return generate(model, tokenizer, prompt=prompt, max_tokens=max_tokens, verbose=False)

          def bootstrap_ci(rows: List[Dict[str, object]], a: str, b: str, n_boot: int = 2000) -> Dict[str, float]:
              by_case: Dict[str, Dict[str, int]] = {}
              for row in rows:
                  by_case.setdefault(str(row["case_id"]), {})[str(row["condition"])] = int(row["success"])

              case_ids = sorted(by_case)
              observed = statistics.mean([by_case[cid][b] - by_case[cid][a] for cid in case_ids])

              rng = random.Random(20260611)
              samples = []
              for _ in range(n_boot):
                  draw = [rng.choice(case_ids) for _ in case_ids]
                  lift = statistics.mean([by_case[cid][b] - by_case[cid][a] for cid in draw])
                  samples.append(lift)

              samples.sort()
              return {
                  "mean_lift": round(observed, 6),
                  "ci95_low": round(samples[int(0.025 * len(samples))], 6),
                  "ci95_high": round(samples[int(0.975 * len(samples))], 6),
              }

          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--model", required=True)
              parser.add_argument("--n-cases", type=int, default=120)
              parser.add_argument("--max-tokens", type=int, default=12)
              args = parser.parse_args()

              out = Path("results/qwen_boundary_audit")
              out.mkdir(parents=True, exist_ok=True)

              cases = build_cases(args.n_cases)
              conditions = ["transcript_only", "route_id_only", "natural_metadata", "forced_route_metadata"]

              prompts = []
              for case in cases:
                  for condition in conditions:
                      prompt = prompt_for(case, condition)
                      prompts.append({
                          "case_id": case["id"],
                          "condition": condition,
                          "gold_label": case["label"],
                          "route_id": case["route_id"],
                          "query_family": case["query_family"],
                          "prompt_sha256": hashlib.sha256(prompt.encode("utf-8")).hexdigest(),
                          "prompt": prompt,
                      })

              with (out / "prompts.csv").open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=list(prompts[0].keys()))
                  writer.writeheader()
                  writer.writerows(prompts)

              start = time.time()
              model, tokenizer = load(args.model)

              rows = []
              for p in prompts:
                  raw = qwen_generate(model, tokenizer, str(p["prompt"]), args.max_tokens)
                  pred = parse_label(raw)
                  success = int(pred == p["gold_label"])
                  rows.append({
                      "case_id": p["case_id"],
                      "condition": p["condition"],
                      "gold_label": p["gold_label"],
                      "route_id": p["route_id"],
                      "query_family": p["query_family"],
                      "prediction": pred,
                      "success": success,
                      "prompt_sha256": p["prompt_sha256"],
                      "raw_output": raw.strip().replace("\n", " ")[:500],
                  })

              with (out / "qwen_predictions.csv").open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
                  writer.writeheader()
                  writer.writerows(rows)

              successes = {}
              accuracies = {}
              for condition in conditions:
                  subset = [r for r in rows if r["condition"] == condition]
                  successes[condition] = sum(int(r["success"]) for r in subset)
                  accuracies[condition] = round(successes[condition] / args.n_cases, 6)

              budget = math.floor(args.n_cases * 0.25)

              ci = {
                  "route_id_only_minus_transcript": bootstrap_ci(rows, "transcript_only", "route_id_only"),
                  "natural_metadata_minus_transcript": bootstrap_ci(rows, "transcript_only", "natural_metadata"),
                  "forced_route_metadata_minus_transcript": bootstrap_ci(rows, "transcript_only", "forced_route_metadata"),
              }

              lifts = {
                  c: successes[c] - successes["transcript_only"]
                  for c in conditions if c != "transcript_only"
              }

              false_pass = {
                  c: successes["transcript_only"] <= budget and successes[c] > budget
                  for c in conditions if c != "transcript_only"
              }

              metadata_conditions = [c for c in conditions if c != "transcript_only"]
              best_condition = max(metadata_conditions, key=lambda c: lifts[c])
              best_lift = lifts[best_condition]

              summary = {
                  "model": args.model,
                  "n_cases": args.n_cases,
                  "conditions": conditions,
                  "metadata_conditions": metadata_conditions,
                  "best_metadata_condition": best_condition,
                  "best_metadata_lift": best_lift,
                  "fixed_audit_budget_successes": budget,
                  "successes": successes,
                  "accuracies": accuracies,
                  "lifts_vs_transcript_only": lifts,
                  "bootstrap_ci": ci,
                  "false_pass": false_pass,
                  "seconds": round(time.time() - start, 3),
              }

              (out / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

              print(json.dumps(summary, indent=2))
              print("")
              print("Raw Qwen outputs:")
              for row in rows:
                  print(
                      f"{row['case_id']} | {row['condition']} | gold={row['gold_label']} | "
                      f"pred={row['prediction']} | success={row['success']} | raw={row['raw_output']}"
                  )

          if __name__ == "__main__":
              main()
          PY

