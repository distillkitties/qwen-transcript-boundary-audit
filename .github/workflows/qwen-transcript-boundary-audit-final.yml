        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lean-toolchain \
            lakefile.lean \
            PACXAI.lean \
            PACXAI \
            scripts \
            experiments \
            README.md \
            REPRODUCE.md \
            LIMITATIONS.md \
            THREAT_MODEL.md \
            ARTIFACT_EVALUATION_README.md

          if [ -d results ]; then
            git add results
          fi

          if [ -d ci-results/latest ]; then
            git add ci-results/latest
          fi

          if [ -f MANIFEST.json ]; then
            git add MANIFEST.json
          fi

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "ci: generate fixed Qwen transcript boundary audit artifact [skip ci]"
            git push
          fi

      - name: Upload reviewer packet
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: qwen-transcript-boundary-audit-reviewer-packet
          path: |
            qwen-transcript-boundary-audit-reviewer-packet.zip
            qwen-transcript-boundary-audit/**
          if-no-files-found: error
          retention-days: 30
