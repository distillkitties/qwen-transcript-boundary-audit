          print("================================================================================")
          print(json.dumps(s, indent=2))

          n = s["n_cases"]
          assert n >= 60

          successes = s["successes"]
          lifts = s["lifts_vs_transcript_only"]
          ci = s["bootstrap_ci"]

          assert successes["explicit_dictionary"] > successes["transcript_only"]
          assert lifts["explicit_dictionary"] > 0
          assert ci["explicit_dictionary_minus_transcript"]["ci95_low"] > 0
          assert s["false_pass"]["explicit_dictionary"] is True

          # Softer checks for realistic metadata conditions. These are recorded even if model behavior is noisy.
          assert "route_id_only" in successes
          assert "natural_metadata" in successes
          assert "explicit_dictionary" in successes

          print("Verdict: real Qwen route-metadata boundary signal PASS")
          print("================================================================================")
          PY

      - name: Generate publication report, plots, tables, and console summary
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          python experiments/make_report.py

      - name: Build clean reviewer packet and exact manifest
        run: |
          set -euxo pipefail

          PACKET_ROOT="qwen-transcript-boundary-audit"

          rm -rf "$PACKET_ROOT"
          mkdir -p "$PACKET_ROOT/logs" "$PACKET_ROOT/.github/workflows"

          cp -R PACXAI "$PACKET_ROOT/"
          cp -R scripts "$PACKET_ROOT/"
          cp -R experiments "$PACKET_ROOT/"
          cp -R results "$PACKET_ROOT/"

          cp \
            lean-toolchain \
            lakefile.lean \
            PACXAI.lean \
            README.md \
            REPRODUCE.md \
            LIMITATIONS.md \
            THREAT_MODEL.md \
            ARTIFACT_EVALUATION_README.md \
            "$PACKET_ROOT/"

          cp \
            lean-version.log \
            lake-version.log \
            lean-build.log \
            lean-audit.log \
            qwen-boundary-audit.log \
            project-files.log \
            "$PACKET_ROOT/logs/"

          cp .github/workflows/*.yml "$PACKET_ROOT/.github/workflows/" 2>/dev/null || true

          cat > "$PACKET_ROOT/OPEN_ME_FIRST.md" <<'EOF'
          # Open me first

          Start here:

          1. Open `results/publishable_artifacts/index.html`.
          2. Read `results/publishable_artifacts/REPORT.md`.
          3. Inspect `results/qwen_boundary_audit/summary.json`.
          4. Inspect `results/publishable_artifacts/qwen_predictions.csv`.
          5. Inspect `results/publishable_artifacts/prompts.csv`.
          6. Inspect `logs/qwen-boundary-audit.log`.
          7. Inspect `logs/lean-audit.log`.
          8. Check `MANIFEST.json`.

          Main result:

          - Lean certifies only the transcript post-processing boundary.
          - Real Qwen inference shows omitted route metadata changes recovery success.
          - The explicit dictionary condition has a bootstrap confidence interval above zero.
          - Therefore a transcript-only audit can falsely pass if route metadata is omitted.

          Scope:

          This is a finite transcript-boundary audit, not a full Shannon/Gaussian/rate-distortion formalization.
          EOF

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path("qwen-transcript-boundary-audit")
          summary = json.loads((root / "results/qwen_boundary_audit/summary.json").read_text())

          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rel = path.relative_to(root).as_posix()
                  files.append({
                      "path": rel,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })

          manifest = {
              "artifact": "qwen-transcript-boundary-audit",
              "model": summary["model"],
              "n_cases": summary["n_cases"],
              "fixed_audit_budget_successes": summary["fixed_audit_budget_successes"],
              "headline": {
                  "successes": summary["successes"],
                  "accuracies": summary["accuracies"],
                  "lifts_vs_transcript_only": summary["lifts_vs_transcript_only"],
                  "bootstrap_ci": summary["bootstrap_ci"],
                  "false_pass": summary["false_pass"],
              },
              "files": files,
          }

          (root / "MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          Path("MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          Path("results/publishable_artifacts/MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY

          # Recompute manifest once after MANIFEST.json exists so the manifest itself is included.
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path("qwen-transcript-boundary-audit")
          summary = json.loads((root / "results/qwen_boundary_audit/summary.json").read_text())

          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  rel = path.relative_to(root).as_posix()
                  files.append({
                      "path": rel,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  })

          manifest = {
              "artifact": "qwen-transcript-boundary-audit",
              "model": summary["model"],
              "n_cases": summary["n_cases"],
              "fixed_audit_budget_successes": summary["fixed_audit_budget_successes"],
              "headline": {
                  "successes": summary["successes"],
                  "accuracies": summary["accuracies"],
                  "lifts_vs_transcript_only": summary["lifts_vs_transcript_only"],
                  "bootstrap_ci": summary["bootstrap_ci"],
                  "false_pass": summary["false_pass"],
              },
              "files": files,
          }

          (root / "MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          Path("MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          Path("results/publishable_artifacts/MANIFEST.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          missing = []
          for rec in files:
              if not (root / rec["path"]).exists():
                  missing.append(rec["path"])
          if missing:
              raise SystemExit(f"Manifest contains missing paths: {missing}")
          PY

          zip -r qwen-transcript-boundary-audit-reviewer-packet.zip "$PACKET_ROOT"

          echo "Reviewer packet created:"
          ls -lh qwen-transcript-boundary-audit-reviewer-packet.zip
          unzip -l qwen-transcript-boundary-audit-reviewer-packet.zip | sed -n '1,220p'

      - name: Prepare CI results
        if: always()
        run: |
          set -euxo pipefail

          rm -rf ci-results/latest
          mkdir -p ci-results/latest

          cp lean-version.log ci-results/latest/ 2>/dev/null || true
          cp lake-version.log ci-results/latest/ 2>/dev/null || true
          cp project-files.log ci-results/latest/ 2>/dev/null || true
          cp lean-build.log ci-results/latest/ 2>/dev/null || true
          cp lean-audit.log ci-results/latest/ 2>/dev/null || true
          cp qwen-boundary-audit.log ci-results/latest/ 2>/dev/null || true
          cp MANIFEST.json ci-results/latest/ 2>/dev/null || true

          if [ -d results ]; then
            mkdir -p ci-results/latest/results
            cp -R results/. ci-results/latest/results/
          fi

          cat > ci-results/latest/summary.md <<EOF
          # Qwen transcript boundary audit latest results

          - Workflow: ${GITHUB_WORKFLOW}
          - Run id: ${GITHUB_RUN_ID}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Commit: ${GITHUB_SHA}
          - Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          This workflow generated a self-contained Lean proof artifact and ran a real Qwen/MLX transcript-boundary audit.

          Main validation:
          - Lean build succeeds.
          - Lean audit has no forbidden proof tokens.
          - Explicit route metadata improves recovery over transcript-only.
          - Bootstrap lower bound for explicit metadata lift is above zero.
          - Transcript-only audit can falsely pass when route metadata is omitted.
          EOF

          find ci-results/latest -type f | sort

      - name: Commit generated artifact outputs back to repo
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            lean-toolchain \
            lakefile.lean \
            PACXAI.lean \
            PACXAI \
            scripts \
            experiments \
            results \
            ci-results/latest \
            README.md \
            REPRODUCE.md \
            LIMITATIONS.md \
            THREAT_MODEL.md \
            ARTIFACT_EVALUATION_README.md \
            MANIFEST.json

          if git diff --cached --quiet; then
            echo "No generated project/result changes to commit."
          else
            git commit -m "ci: generate final Qwen transcript boundary audit artifact [skip ci]"
            git push
          fi

      - name: Upload Qwen reviewer packet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-transcript-boundary-audit-reviewer-packet
          path: |
            qwen-transcript-boundary-audit-reviewer-packet.zip
            qwen-transcript-boundary-audit/**
          if-no-files-found: error
          retention-days: 30
